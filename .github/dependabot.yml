version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      angular:
        patterns:
          - '@angular/*'
          - 'angular-eslint'
    ignore:
      # TypeScript 7 系は見送る。Angular と typescript-eslint が 7 系に対応するまで上げない
      - dependency-name: typescript
        versions: ['>= 7.0.0, < 8.0.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
