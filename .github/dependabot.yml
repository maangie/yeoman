version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      angular:
        patterns:
          - '@angular/*'
          - 'angular-eslint'
    ignore:
      # TypeScript 7.0 系は見送り、7.1 の正式版が出てから上げる
      - dependency-name: typescript
        versions: ['>= 7.0.0, < 7.1.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
